name: Upstream Watch

on:
  schedule:
    # Check upstream daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/openclaw/openclaw.git 2>/dev/null || true
          git fetch upstream main --quiet

      - name: Check for upstream changes
        id: check
        run: |
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          UPSTREAM_COMMITS=$(git rev-list "$MERGE_BASE"..upstream/main --count)
          echo "upstream_commits=$UPSTREAM_COMMITS" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_COMMITS" -eq 0 ]; then
            echo "No new upstream commits"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Found $UPSTREAM_COMMITS new upstream commits"

          # Check if any patched files changed
          PATCHED_CONFLICTS=$(git diff "$MERGE_BASE"..upstream/main --name-only | grep -cE '^(tsdown\.config\.ts|src/daemon/service\.ts|src/shared/net/ip\.ts|src/discord/voice/manager\.ts|src/browser/pw-tools-core\.downloads\.ts|src/browser/chrome\.executables\.ts|src/agents/skills-install\.ts|package\.json)$' || echo "0")
          echo "patched_conflicts=$PATCHED_CONFLICTS" >> "$GITHUB_OUTPUT"

          # Get summary of changes
          SUMMARY=$(git log "$MERGE_BASE"..upstream/main --oneline | head -20)
          # Write multiline to output
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commits = ${{ steps.check.outputs.upstream_commits }};
            const conflicts = ${{ steps.check.outputs.patched_conflicts }};
            const summary = `${{ steps.check.outputs.summary }}`;
            const title = `🔄 Upstream update available: ${commits} new commits`;
            const severity = conflicts > 0 ? '⚠️ **Patched file conflicts detected** — manual merge likely needed' : '✅ No patched file conflicts — clean merge expected';

            const body = `## Upstream Changes Detected

${severity}

- **New commits**: ${commits}
- **Patched file conflicts**: ${conflicts}

### Recent upstream commits
\`\`\`
${summary}
\`\`\`

### Recommended actions
1. Run \`bash scripts/termux-compat-analyzer.sh\` for detailed analysis
2. Follow \`docs/TERMUX-UPGRADE-CHECKLIST.md\`
3. After merge, run \`bash scripts/termux-patch-verify.sh\`

---
*Auto-generated by upstream-watch workflow*`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-sync',
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Update existing
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                title,
                body,
              });
            } else {
              // Create new
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-sync'],
              });
            }
